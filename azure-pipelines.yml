trigger:
  - main

stages:
  - stage: Build
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Build
        displayName: Build & Test with Aspire
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10 SDK
            inputs:
              version: 10.0.x

          - script: |
              dnx Aspire.Cli do build --non-interactive
            displayName: Build Application with Aspire

          - task: DotNetCoreCLI@2
            displayName: Run Unit Tests
            inputs:
              command: test
              projects: '**/*UnitTests.csproj'
