trigger:
  - main

stages:
  - stage: Build
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Build
        displayName: Build & Test with Aspire
        steps:
          - task: UseDotNet@2
            displayName: Use .NET SDK from global.json
            inputs:
              useGlobalJson: true
              checkForExistingVersion: true

          - script: |
              dotnet tool exec Aspire.Cli do build --non-interactive
            displayName: Build Application with Aspire

          - task: DotNetCoreCLI@2
            displayName: Run Unit Tests
            inputs:
              command: test
              projects: '**/*UnitTests.csproj'
